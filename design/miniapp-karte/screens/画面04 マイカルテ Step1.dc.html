<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E5DFD3;font-family:"Zen Kaku Gothic New",sans-serif;-webkit-font-smoothing:antialiased}
a{color:#8A7A5F;text-decoration:none}a:hover{color:#6B5E48}
</style>
</helmet>
<div style="width:390px;background:#F3EEE5;color:#2E2A24;display:flex;flex-direction:column">
  <div style="display:flex;justify-content:space-between;padding:14px 24px 6px;font-size:12px;font-weight:700"><span>12:27</span><span>4G 65</span></div>
  <div style="display:flex;align-items:center;gap:8px;padding:4px 18px 10px"><span style="flex:1;text-align:center;font-size:12px;font-weight:700">salonrink.com</span><span style="font-size:14px;color:#8B8478">✕</span></div>

  <div style="padding:14px 18px 12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid #E5DDCF">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <span style="font-family:'Shippori Mincho',serif;font-size:17px;font-weight:500">いまの髪</span>
      <span style="font-size:10.5px;color:#A2988A">Step 1 / 4</span>
    </div>
    <div style="display:flex;gap:5px">
      <span style="flex:1;height:4px;border-radius:99px;background:#A98D4B"></span>
      <span style="flex:1;height:4px;border-radius:99px;background:#E7DCC4"></span>
      <span style="flex:1;height:4px;border-radius:99px;background:#E7DCC4"></span>
      <span style="flex:1;height:4px;border-radius:99px;background:#E7DCC4"></span>
    </div>
  </div>

  <div style="padding:16px 18px 20px;display:flex;flex-direction:column;gap:14px">
    <div style="background:#fff;border-radius:18px;padding:17px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 0 #E5DDCF">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="font-family:'Shippori Mincho',serif;font-size:14px;font-weight:500">今の状態の写真</span>
        <span style="font-size:10.5px;color:#A2988A">きろくから3枚</span>
      </div>
      <div style="display:flex;gap:7px">
        <div style="flex:1;display:flex;flex-direction:column;gap:5px;align-items:center"><div style="width:100%;height:80px;background:#EFE8DA;border-radius:12px"></div><span style="font-size:9.5px;color:#A2988A">正面</span></div>
        <div style="flex:1;display:flex;flex-direction:column;gap:5px;align-items:center"><div style="width:100%;height:80px;background:#EFE8DA;border-radius:12px"></div><span style="font-size:9.5px;color:#A2988A">後ろ</span></div>
        <div style="flex:1;display:flex;flex-direction:column;gap:5px;align-items:center"><div style="width:100%;height:80px;background:#EFE8DA;border-radius:12px"></div><span style="font-size:9.5px;color:#A2988A">根元</span></div>
      </div>
      <div style="display:flex;gap:8px">
        <div style="flex:1;text-align:center;border:1px solid #E5DDCF;border-radius:99px;padding:11px;font-size:12px">写真を選ぶ</div>
        <div style="flex:1;text-align:center;border:1px solid #E5DDCF;border-radius:99px;padding:11px;font-size:12px">カメラで撮る</div>
      </div>
      <span style="font-size:10.5px;line-height:1.7;color:#A2988A">自然光・髪をおろした状態がいちばん伝わります</span>
    </div>

    <div style="background:#fff;border-radius:18px;padding:17px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 0 #E5DDCF">
      <span style="font-family:'Shippori Mincho',serif;font-size:14px;font-weight:500">気になる悩み（複数選択）</span>
      <div style="display:flex;flex-wrap:wrap;gap:7px;font-size:11.5px">
        <span style="border:1px solid #A98D4B;background:#EFE8DA;color:#8A7A5F;border-radius:99px;padding:8px 14px;font-weight:500">広がりやすい</span>
        <span style="border:1px solid #E5DDCF;border-radius:99px;padding:8px 14px">うねり・くせ</span>
        <span style="border:1px solid #A98D4B;background:#EFE8DA;color:#8A7A5F;border-radius:99px;padding:8px 14px;font-weight:500">パサつき・乾燥</span>
        <span style="border:1px solid #E5DDCF;border-radius:99px;padding:8px 14px">ぺたんこ</span>
        <span style="border:1px solid #E5DDCF;border-radius:99px;padding:8px 14px">頭皮のかゆみ</span>
        <span style="border:1px solid #E5DDCF;border-radius:99px;padding:8px 14px">ニオイ</span>
        <span style="border:1px solid #A98D4B;background:#EFE8DA;color:#8A7A5F;border-radius:99px;padding:8px 14px;font-weight:500">白髪が増えた</span>
      </div>
    </div>

    <div style="background:#EDE5D6;border-radius:18px;padding:15px 17px;display:flex;flex-direction:column;gap:8px">
      <span style="font-size:11.5px;font-weight:700;color:#8A7A5F">自動で添付されます</span>
      <span style="font-size:11.5px;line-height:1.8;color:#5F584E">髪質74・頭皮61・白髪90（6/28 診断）／ 前回の施術から106日</span>
    </div>

    <div style="background:#1B1815;color:#fff;text-align:center;border-radius:99px;padding:15px;font-size:13.5px;font-weight:700">次へ</div>
  </div>

  <div style="display:flex;border-top:1px solid #E5DDCF;background:#fff;padding:10px 0 16px">
    <div style="flex:1;text-align:center;font-size:10px;color:#A2988A">ホーム</div>
    <div style="flex:1;text-align:center;font-size:10px;color:#A2988A">きろく</div>
    <div style="flex:1;text-align:center;font-size:10px;font-weight:700;color:#8A7A5F">マイカルテ</div>
    <div style="flex:1;text-align:center;font-size:10px;color:#A2988A">サロン</div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:900}}"></script>
</body>
</html>
