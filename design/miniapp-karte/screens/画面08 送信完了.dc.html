<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E5DFD3;font-family:"Zen Kaku Gothic New",sans-serif;-webkit-font-smoothing:antialiased}
a{color:#8A7A5F;text-decoration:none}a:hover{color:#6B5E48}
</style>
</helmet>
<div style="width:390px;min-height:844px;background:#F3EEE5;color:#2E2A24;display:flex;flex-direction:column">
  <div style="display:flex;justify-content:space-between;padding:14px 24px 6px;font-size:12px;font-weight:700"><span>12:29</span><span>4G 64</span></div>
  <div style="display:flex;align-items:center;gap:8px;padding:4px 18px 10px"><span style="flex:1;text-align:center;font-size:12px;font-weight:700">salonrink.com</span><span style="font-size:14px;color:#8B8478">✕</span></div>

  <div style="flex:1;padding:40px 22px 24px;display:flex;flex-direction:column;gap:22px">
    <div style="display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center">
      <div style="width:64px;height:64px;border-radius:50%;background:#EFE8DA;display:flex;align-items:center;justify-content:center;font-size:26px;color:#A98D4B">✓</div>
      <h1 style="margin:0;font-family:'Shippori Mincho',serif;font-size:23px;line-height:1.5;font-weight:500">事前カルテを<br>送信しました</h1>
      <p style="margin:0;font-size:12.5px;line-height:1.9;color:#5F584E">ヘアサロン公式LINEに届いています。<br>返信があるとLINEでお知らせします。</p>
    </div>

    <div style="background:#fff;border-radius:18px;padding:17px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 0 #E5DDCF">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="font-family:'Shippori Mincho',serif;font-size:14px;font-weight:500">送信済み</span>
        <span style="font-size:10.5px;color:#A98D4B;font-weight:700">返信待ち</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:7px;font-size:11.5px">
        <div style="display:flex;justify-content:space-between;background:#F7F3EA;border-radius:11px;padding:10px 12px"><span style="color:#7A7266">送信先</span><span>ヘアサロン公式LINE</span></div>
        <div style="display:flex;justify-content:space-between;background:#F7F3EA;border-radius:11px;padding:10px 12px"><span style="color:#7A7266">来店予定</span><span>6/15（月）14:00</span></div>
        <div style="display:flex;justify-content:space-between;background:#F7F3EA;border-radius:11px;padding:10px 12px"><span style="color:#7A7266">送信日時</span><span>6/12（金）12:29</span></div>
      </div>
      <div style="text-align:center;border:1px solid #E5DDCF;border-radius:99px;padding:12px;font-size:12px">送信した内容を見る</div>
    </div>

    <div style="background:#fff;border-radius:18px;padding:17px;display:flex;flex-direction:column;gap:13px;box-shadow:0 1px 0 #E5DDCF">
      <span style="font-family:'Shippori Mincho',serif;font-size:14px;font-weight:500">来店までにできること</span>
      <div style="display:flex;gap:12px;align-items:flex-start">
        <span style="font-family:'Shippori Mincho',serif;font-size:15px;color:#A98D4B;width:22px;flex:none">01</span>
        <div style="flex:1;display:flex;flex-direction:column;gap:3px"><span style="font-size:12.5px;font-weight:700">内容の追加・修正</span><span style="font-size:11px;line-height:1.7;color:#7A7266">来店の前日まで、写真や希望を追加できます</span></div>
      </div>
      <div style="display:flex;gap:12px;align-items:flex-start">
        <span style="font-family:'Shippori Mincho',serif;font-size:15px;color:#A98D4B;width:22px;flex:none">02</span>
        <div style="flex:1;display:flex;flex-direction:column;gap:3px"><span style="font-size:12.5px;font-weight:700">気づいたことを記録</span><span style="font-size:11px;line-height:1.7;color:#7A7266">まとまらない日の写真も相談材料になります</span></div>
      </div>
      <div style="display:flex;gap:12px;align-items:flex-start">
        <span style="font-family:'Shippori Mincho',serif;font-size:15px;color:#A98D4B;width:22px;flex:none">03</span>
        <div style="flex:1;display:flex;flex-direction:column;gap:3px"><span style="font-size:12.5px;font-weight:700">イメージを保存箱に追加</span><span style="font-size:11px;line-height:1.7;color:#7A7266">当日までに気が変わったら差し替えできます</span></div>
      </div>
    </div>

    <div style="display:flex;gap:8px">
      <div style="flex:1;text-align:center;border:1px solid #E5DDCF;border-radius:99px;padding:14px;font-size:12.5px">きろくに戻る</div>
      <div style="flex:1;background:#1B1815;color:#fff;text-align:center;border-radius:99px;padding:14px;font-size:12.5px;font-weight:700">ホームへ</div>
    </div>
  </div>

  <div style="display:flex;border-top:1px solid #E5DDCF;background:#fff;padding:10px 0 16px">
    <div style="flex:1;text-align:center;font-size:10px;color:#A2988A">ホーム</div>
    <div style="flex:1;text-align:center;font-size:10px;color:#A2988A">きろく</div>
    <div style="flex:1;text-align:center;font-size:10px;font-weight:700;color:#8A7A5F">マイカルテ</div>
    <div style="flex:1;text-align:center;font-size:10px;color:#A2988A">サロン</div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:900}}"></script>
</body>
</html>
