<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E5DFD3;font-family:"Zen Kaku Gothic New",sans-serif;-webkit-font-smoothing:antialiased}
a{color:#8A7A5F;text-decoration:none}a:hover{color:#6B5E48}
</style>
</helmet>
<div style="width:390px;background:#F3EEE5;color:#2E2A24;display:flex;flex-direction:column">
  <div style="display:flex;justify-content:space-between;padding:14px 24px 6px;font-size:12px;font-weight:700"><span>12:27</span><span>4G 65</span></div>
  <div style="display:flex;align-items:center;gap:8px;padding:4px 18px 10px"><span style="flex:1;text-align:center;font-size:12px;font-weight:700">salonrink.com</span><span style="font-size:14px;color:#8B8478">✕</span></div>

  <div style="padding:14px 18px 12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid #E5DDCF">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <span style="font-family:'Shippori Mincho',serif;font-size:17px;font-weight:500">なりたいイメージ</span>
      <span style="font-size:10.5px;color:#A2988A">Step 2 / 4</span>
    </div>
    <div style="display:flex;gap:5px">
      <span style="flex:1;height:4px;border-radius:99px;background:#A98D4B"></span>
      <span style="flex:1;height:4px;border-radius:99px;background:#A98D4B"></span>
      <span style="flex:1;height:4px;border-radius:99px;background:#E7DCC4"></span>
      <span style="flex:1;height:4px;border-radius:99px;background:#E7DCC4"></span>
    </div>
  </div>

  <div style="padding:16px 18px 20px;display:flex;flex-direction:column;gap:14px">
    <div style="background:#fff;border-radius:18px;padding:17px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 0 #E5DDCF">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="font-family:'Shippori Mincho',serif;font-size:14px;font-weight:500">保存箱から選ぶ</span>
        <span style="font-size:10.5px;color:#A2988A">12枚保存中 ／ 2枚選択</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px">
        <div style="aspect-ratio:1;background:#EFE8DA;border-radius:12px;position:relative"><span style="position:absolute;right:5px;top:5px;width:17px;height:17px;border-radius:50%;background:#A98D4B;color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center">✓</span></div>
        <div style="aspect-ratio:1;background:#EFE8DA;border-radius:12px;position:relative"><span style="position:absolute;right:5px;top:5px;width:17px;height:17px;border-radius:50%;background:#A98D4B;color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center">✓</span></div>
        <div style="aspect-ratio:1;background:#E7DCC4;border-radius:12px"></div>
        <div style="aspect-ratio:1;background:#E7DCC4;border-radius:12px"></div>
        <div style="aspect-ratio:1;background:#EFE8DA;border-radius:12px"></div>
        <div style="aspect-ratio:1;border:1px dashed #D8CCB8;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#B3A996;font-size:17px">＋</div>
      </div>
      <div style="border:1px solid #E5DDCF;border-radius:12px;padding:12px;font-size:11.5px;line-height:1.75;color:#A2988A">柔らかく透明感のある、くすみベージュにしたい</div>
    </div>

    <div style="background:#fff;border-radius:18px;padding:17px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 0 #E5DDCF">
      <div style="display:flex;flex-direction:column;gap:4px">
        <span style="font-family:'Shippori Mincho',serif;font-size:14px;font-weight:500">絶対に避けたいこと</span>
        <span style="font-size:10.5px;line-height:1.7;color:#A2988A">言いにくい条件も、ここで先に伝えられます</span>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:7px;font-size:11.5px">
        <span style="border:1px solid #D9B3A6;background:#FBF1ED;color:#A8705C;border-radius:99px;padding:8px 13px;font-weight:500">赤みを出したくない</span>
        <span style="border:1px solid #D9B3A6;background:#FBF1ED;color:#A8705C;border-radius:99px;padding:8px 13px;font-weight:500">前髪は切らない</span>
        <span style="border:1px solid #E5DDCF;border-radius:99px;padding:8px 13px">短くしすぎない</span>
        <span style="border:1px solid #E5DDCF;border-radius:99px;padding:8px 13px">明るくしすぎない</span>
        <span style="border:1px solid #E5DDCF;border-radius:99px;padding:8px 13px;color:#A2988A">＋ 追加</span>
      </div>
    </div>

    <div style="display:flex;gap:9px">
      <div style="flex:none;width:96px;text-align:center;border:1px solid #E5DDCF;border-radius:99px;padding:15px;font-size:13px;color:#7A7266">戻る</div>
      <div style="flex:1;background:#1B1815;color:#fff;text-align:center;border-radius:99px;padding:15px;font-size:13.5px;font-weight:700">次へ</div>
    </div>
  </div>

  <div style="display:flex;border-top:1px solid #E5DDCF;background:#fff;padding:10px 0 16px">
    <div style="flex:1;text-align:center;font-size:10px;color:#A2988A">ホーム</div>
    <div style="flex:1;text-align:center;font-size:10px;color:#A2988A">きろく</div>
    <div style="flex:1;text-align:center;font-size:10px;font-weight:700;color:#8A7A5F">マイカルテ</div>
    <div style="flex:1;text-align:center;font-size:10px;color:#A2988A">サロン</div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:900}}"></script>
</body>
</html>
