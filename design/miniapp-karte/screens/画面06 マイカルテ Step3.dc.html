<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E5DFD3;font-family:"Zen Kaku Gothic New",sans-serif;-webkit-font-smoothing:antialiased}
a{color:#8A7A5F;text-decoration:none}a:hover{color:#6B5E48}
</style>
</helmet>
<div style="width:390px;background:#F3EEE5;color:#2E2A24;display:flex;flex-direction:column">
  <div style="display:flex;justify-content:space-between;padding:14px 24px 6px;font-size:12px;font-weight:700"><span>12:27</span><span>4G 65</span></div>
  <div style="display:flex;align-items:center;gap:8px;padding:4px 18px 10px"><span style="flex:1;text-align:center;font-size:12px;font-weight:700">salonrink.com</span><span style="font-size:14px;color:#8B8478">✕</span></div>

  <div style="padding:14px 18px 12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid #E5DDCF">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <span style="font-family:'Shippori Mincho',serif;font-size:17px;font-weight:500">希望と目的</span>
      <span style="font-size:10.5px;color:#A2988A">Step 3 / 4</span>
    </div>
    <div style="display:flex;gap:5px">
      <span style="flex:1;height:4px;border-radius:99px;background:#A98D4B"></span>
      <span style="flex:1;height:4px;border-radius:99px;background:#A98D4B"></span>
      <span style="flex:1;height:4px;border-radius:99px;background:#A98D4B"></span>
      <span style="flex:1;height:4px;border-radius:99px;background:#E7DCC4"></span>
    </div>
  </div>

  <div style="padding:16px 18px 20px;display:flex;flex-direction:column;gap:14px">
    <div style="background:#fff;border-radius:18px;padding:17px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 0 #E5DDCF">
      <span style="font-family:'Shippori Mincho',serif;font-size:14px;font-weight:500">今回の希望</span>
      <div style="display:flex;flex-wrap:wrap;gap:7px;font-size:11.5px">
        <span style="background:#8A7A5F;color:#fff;border-radius:99px;padding:8px 14px;font-weight:500">カラー</span>
        <span style="background:#8A7A5F;color:#fff;border-radius:99px;padding:8px 14px;font-weight:500">トリートメント</span>
        <span style="border:1px solid #E5DDCF;border-radius:99px;padding:8px 14px">カット</span>
        <span style="border:1px solid #E5DDCF;border-radius:99px;padding:8px 14px">パーマ</span>
        <span style="border:1px solid #E5DDCF;border-radius:99px;padding:8px 14px">白髪ぼかし</span>
        <span style="border:1px solid #E5DDCF;border-radius:99px;padding:8px 14px">ヘッドスパ</span>
        <span style="border:1px solid #E5DDCF;border-radius:99px;padding:8px 14px">ネイル</span>
        <span style="border:1px solid #E5DDCF;border-radius:99px;padding:8px 14px">相談だけ</span>
      </div>
    </div>

    <div style="background:#fff;border-radius:18px;padding:17px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 0 #E5DDCF">
      <span style="font-family:'Shippori Mincho',serif;font-size:14px;font-weight:500">来店の目的</span>
      <div style="display:flex;flex-direction:column;gap:8px;font-size:11.5px">
        <div style="display:flex;justify-content:space-between;align-items:center;border:1px solid #A98D4B;background:#EFE8DA;border-radius:12px;padding:12px 14px"><span style="color:#8A7A5F;font-weight:500">相談して決めたい</span><span style="width:17px;height:17px;border-radius:50%;background:#A98D4B;color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;flex:none">✓</span></div>
        <div style="display:flex;justify-content:space-between;align-items:center;border:1px solid #E5DDCF;border-radius:12px;padding:12px 14px"><span>メニューは決めている</span><span style="width:17px;height:17px;border-radius:50%;border:1px solid #D8CCB8;flex:none"></span></div>
        <div style="display:flex;justify-content:space-between;align-items:center;border:1px solid #E5DDCF;border-radius:12px;padding:12px 14px"><span>おまかせしたい</span><span style="width:17px;height:17px;border-radius:50%;border:1px solid #D8CCB8;flex:none"></span></div>
      </div>
    </div>

    <div style="background:#fff;border-radius:18px;padding:17px;display:flex;flex-direction:column;gap:11px;box-shadow:0 1px 0 #E5DDCF">
      <span style="font-family:'Shippori Mincho',serif;font-size:14px;font-weight:500">伝えておきたいこと</span>
      <div style="border:1px solid #E5DDCF;border-radius:12px;padding:12px;font-size:11.5px;line-height:1.8;color:#A2988A;min-height:60px">例）前回のカラーが少し明るすぎたので、今回は落ち着いた色味に。肩につかない長さで扱いやすく。</div>
    </div>

    <div style="display:flex;gap:9px">
      <div style="flex:none;width:96px;text-align:center;border:1px solid #E5DDCF;border-radius:99px;padding:15px;font-size:13px;color:#7A7266">戻る</div>
      <div style="flex:1;background:#1B1815;color:#fff;text-align:center;border-radius:99px;padding:15px;font-size:13.5px;font-weight:700">確認へ</div>
    </div>
  </div>

  <div style="display:flex;border-top:1px solid #E5DDCF;background:#fff;padding:10px 0 16px">
    <div style="flex:1;text-align:center;font-size:10px;color:#A2988A">ホーム</div>
    <div style="flex:1;text-align:center;font-size:10px;color:#A2988A">きろく</div>
    <div style="flex:1;text-align:center;font-size:10px;font-weight:700;color:#8A7A5F">マイカルテ</div>
    <div style="flex:1;text-align:center;font-size:10px;color:#A2988A">サロン</div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:900}}"></script>
</body>
</html>
